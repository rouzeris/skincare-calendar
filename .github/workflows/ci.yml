name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install landing page dependencies
        run: bun install --frozen-lockfile --cwd www

      - name: Lint, typecheck, format check
        run: hk check --all

      - name: Test local data repository
        run: bun run test:unit

      - name: Test catalog importer and backend
        run: bun run catalog:test && bun run test:convex

      - name: Build landing page
        run: bun run --cwd www build

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run Playwright e2e tests
        run: bun run test
        env:
          EXPO_PUBLIC_CATALOG_FIXTURE: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
